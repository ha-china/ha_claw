set_option:
  name: Set option
  description: "Update a Claw Assistant configuration option"
  fields:
    key:
      name: Key
      description: Config option key
      required: true
      example: "enable_web_search"
      selector:
        text:
          multiple: false
          multiline: false
    value:
      name: Value
      description: Config option value
      required: true
      selector:
        text:

list_workspace:
  name: List workspace
  description: "List skills, docs, and plugins in the Claw workspace"
  fields:
    category:
      name: Category
      description: "Category to list (skills, docs, plugins, or all)"
      required: false
      example: "all"
      selector:
        select:
          options:
            - "skills"
            - "docs"
            - "plugins"
            - "all"

read_workspace_file:
  name: Read workspace file
  description: "Read a file from the Claw workspace"
  fields:
    path:
      name: Path
      description: "Relative path within the workspace"
      required: true
      example: "SOUL.md"
      selector:
        text:

write_workspace_file:
  name: Write workspace file
  description: "Write a file to the Claw workspace"
  fields:
    path:
      name: Path
      description: "Relative path within the workspace"
      required: true
      example: "SOUL.md"
      selector:
        text:
          multiline: true
    content:
      name: Content
      description: "File content to write"
      required: true
      selector:
        text:
          multiline: true

get_rules:
  name: Get hard boundary rules
  description: "List all hard boundary rules (enabled and disabled) from the rules store"
  fields: {}

toggle_rule:
  name: Toggle hard boundary rule
  description: "Enable or disable a hard boundary rule by id"
  fields:
    rule_id:
      name: Rule ID
      description: "Rule identifier, e.g. rule_001"
      required: true
      example: "rule_001"
      selector:
        text:
    enabled:
      name: Enabled
      description: "Whether the rule is enabled"
      required: true
      selector:
        boolean:

add_rule:
  name: Add hard boundary rule
  description: "Create a new enabled hard boundary rule"
  fields:
    category:
      name: Category
      description: "Rule category (always, never, reply, custom)"
      required: true
      example: "never"
      selector:
        select:
          options:
            - "always"
            - "never"
            - "reply"
            - "custom"
    description:
      name: Description
      description: "Rule text injected into the AI system prompt"
      required: true
      example: "不要删除或修改自动化规则"
      selector:
        text:
          multiline: true

delete_rule:
  name: Delete hard boundary rule
  description: "Remove a hard boundary rule by id"
  fields:
    rule_id:
      name: Rule ID
      description: "Rule identifier, e.g. rule_001"
      required: true
      example: "rule_001"
      selector:
        text:

refresh_sensor:
  name: Refresh config sensor
  description: "Force refresh the Claw Config sensor state"
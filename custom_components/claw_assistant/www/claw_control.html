<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claw Assistant Control</title>
<style>
:root {
  /* Map to Home Assistant theme variables (injected from parent frame at runtime).
     Fallbacks match HA default light theme so the panel still looks right standalone. */
  --bg: var(--primary-background-color, #f7f7f7);
  --card: var(--card-background-color, #ffffff);
  --side: var(--secondary-background-color, #f0f0f0);
  --txt: var(--primary-text-color, #212121);
  --sec: var(--secondary-text-color, #717171);
  --div: var(--divider-color, rgba(0,0,0,0.12));
  --pri: var(--primary-color, #03a9f4);
  --pri-txt: var(--text-primary-color, #ffffff);
  /* Card surface tokens — HA card look */
  --card-radius: 16px;
  --card-shadow: 0 1px 4px rgba(0,0,0,0.06);
  --card-shadow-hover: 0 2px 10px rgba(0,0,0,0.10);
  --ha-color-scheme: light;
}

/* ── Dark mode: triggered by HA parent OR system preference ── */
:root.ha-dark,
:root[data-ha-theme="dark"],
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--primary-background-color, #0d0d0d);
    --card: var(--card-background-color, #1c1c1e);
    --side: var(--secondary-background-color, #272729);
    --txt: var(--primary-text-color, #e1e1e1);
    --sec: var(--secondary-text-color, #9b9b9b);
    --div: var(--divider-color, rgba(255,255,255,0.12));
    --pri: var(--primary-color, #03a9f4);
    --pri-txt: var(--text-primary-color, #ffffff);
    --ha-color-scheme: dark;
  }
}

/* Apply dark-specific component overrides when in dark mode */
:root.ha-dark .btn{background:var(--side);color:var(--txt);border-color:var(--div)}
:root.ha-dark .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
:root.ha-dark .toolbar .tb-search .inp{background:var(--side);color:var(--txt);border-color:var(--div)}
:root.ha-dark .toolbar .tb-search .inp::placeholder{color:var(--sec)}
:root.ha-dark .inp{background:var(--side);color:var(--txt)}
:root.ha-dark .sel{background:var(--side);color:var(--txt)}
:root.ha-dark .group-card{background:var(--card);border-color:var(--div)}
:root.ha-dark .gc-head{border-bottom:1px solid var(--div)}
:root.ha-dark .gc-ic{background:color-mix(in srgb,var(--pri) 18%,transparent)}
:root.ha-dark .pbadge.RUNNING{background:rgba(52,199,89,.18);color:#34C759}
:root.ha-dark .pbadge.STOPPED{background:rgba(255,149,0,.18);color:#FF9500}
:root.ha-dark .pbadge.FAILED{background:rgba(255,69,58,.18);color:#FF453A}
:root.ha-dark .modal-mask{background:rgba(0,0,0,.65)}
:root.ha-dark .modal-box{background:var(--card);border-color:var(--div)}
:root.ha-dark .btn-tip[title]:hover::after{background:var(--side);color:var(--txt);border-color:var(--div)}
:root.ha-dark .action-card{background:var(--card);border-color:var(--div)}
:root.ha-dark .tabs{background:var(--card);border-color:var(--div)}
:root.ha-dark .tab{color:var(--sec)}
:root.ha-dark .tab:hover{color:var(--txt)}
:root.ha-dark .tab.active{color:var(--pri)}
:root.ha-dark .hint{color:var(--sec)}
:root.ha-dark .field-help{color:var(--sec)}
:root.ha-dark .empty-state{color:var(--sec)}
:root.ha-dark .empty-state .es-ic{color:var(--sec)}
:root.ha-dark .mini-btn{background:var(--side);color:var(--pri);border-color:var(--div)}
:root.ha-dark .mini-btn:hover{border-color:var(--pri)}
:root.ha-dark .bot{background:var(--card);border-color:var(--div)}
:root.ha-dark .conv-list-item:hover{background:color-mix(in srgb,var(--pri) 6%,var(--bg))}
:root.ha-dark .conv-list-item.conv-li-active{background:color-mix(in srgb,var(--pri) 12%,var(--bg))}
:root.ha-dark .ed-head{background:var(--side)}
:root.ha-dark .ed-bar{background:var(--side);border-color:var(--div)}
:root.ha-dark .ed-btn{background:var(--card);color:var(--txt);border-color:var(--div)}
:root.ha-dark .sk-card,
:root.ha-dark .pl-card{background:var(--card);border-color:var(--div)}
:root.ha-dark .rule-item{background:var(--card);border-color:var(--div)}
:root.ha-dark .dimmed{color:var(--sec)}

@media (prefers-color-scheme: dark) {
  .btn{background:var(--side);color:var(--txt);border-color:var(--div)}
  .btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  .toolbar .tb-search .inp{background:var(--side);color:var(--txt);border-color:var(--div)}
  .toolbar .tb-search .inp::placeholder{color:var(--sec)}
  .inp{background:var(--side);color:var(--txt)}
  .sel{background:var(--side);color:var(--txt)}
  .group-card{background:var(--card);border-color:var(--div)}
  .gc-head{border-bottom:1px solid var(--div)}
  .gc-ic{background:color-mix(in srgb,var(--pri) 18%,transparent)}
  .pbadge.RUNNING{background:rgba(52,199,89,.18);color:#34C759}
  .pbadge.STOPPED{background:rgba(255,149,0,.18);color:#FF9500}
  .pbadge.FAILED{background:rgba(255,69,58,.18);color:#FF453A}
  .modal-mask{background:rgba(0,0,0,.65)}
  .modal-box{background:var(--card);border-color:var(--div)}
  .btn-tip[title]:hover::after{background:var(--side);color:var(--txt);border-color:var(--div)}
  .action-card{background:var(--card);border-color:var(--div)}
  .tabs{background:var(--card);border-color:var(--div)}
  .tab{color:var(--sec)}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--pri)}
  .mini-btn{background:var(--side);color:var(--pri);border-color:var(--div)}
  .mini-btn:hover{border-color:var(--pri)}
}

/* Smooth theme transitions for key surface elements */
.hdr, .group-card, .inp, .sel, .btn, .tb-search, .modal-box, .action-card, .tabs, .mini-btn, .bot, .gc-head, .toolbar {
  transition: background-color .3s ease, color .3s ease, border-color .3s ease;
}
body{transition:background-color .3s ease,color .3s ease}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-size:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.cp{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--card);border-bottom:1px solid var(--div)}
.logo-badge{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ov{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ov-item{display:flex;align-items:center;gap:5px;padding:2px 12px;white-space:nowrap}
.ov-item+.ov-item{border-left:1px solid var(--div)}
.ov-k{font-size:.72rem;color:var(--sec)}
.ov-v{font-size:.82rem;font-weight:700;color:var(--txt)}
.ov-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.si{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.si-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:20px;background:linear-gradient(135deg,#34C759,#30D158);color:#fff;font-size:.82rem;font-weight:600;box-shadow:0 2px 8px rgba(52,199,89,.35);white-space:nowrap;transition:all .25s}
.si-pill.off{background:linear-gradient(135deg,#FF3B30,#FF453A);box-shadow:0 2px 8px rgba(255,59,48,.3)}
.si-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}
.si-clock{font-size:.82rem;font-weight:600;color:var(--pri);font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--pri) 10%,transparent);padding:4px 10px;border-radius:8px;white-space:nowrap}
.si-ref{padding:5px 12px;font-size:.78rem}
.mini-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:10px;border:1px solid var(--div);background:var(--side);color:var(--pri);font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.mini-btn:hover{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--side))}
.mini-btn ha-icon{--mdc-icon-size:18px}
.tabs{flex-shrink:0;width:100%;display:flex;gap:4px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--div);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:13px 16px;border:none;background:transparent;color:var(--sec);cursor:pointer;font-size:.95rem;font-weight:600;font-family:inherit;white-space:nowrap;border-bottom:3px solid transparent;transition:all .15s;display:flex;align-items:center;gap:7px;flex-shrink:0}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.tab ha-icon{--mdc-icon-size:17px}
.cnt{flex:1;display:flex;flex-direction:column;min-width:0;overflow-y:auto}
.form{max-width:100%;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:100%;align-items:start}
.form.narrow{grid-template-columns:1fr;max-width:720px;margin-left:0}
.form.group{grid-template-columns:1fr}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;width:100%}
.group-card{background:var(--card);border:1px solid var(--div);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.gc-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.gc-ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri);flex-shrink:0}
.gc-ic ha-icon{--mdc-icon-size:20px}
.gc-tx{flex:1;min-width:0}
.gc-t{font-weight:600;font-size:.98rem;color:var(--txt)}
.gc-d{font-size:.8rem;color:var(--sec);margin-top:2px}
.gc-chev{color:var(--sec);transition:transform .2s}
.group-card.open .gc-chev{transform:rotate(180deg)}
.gc-body{padding:0 16px;display:none}
.group-card.open .gc-body{display:block;padding:14px 16px 16px;border-top:1px solid var(--div)}
.step-intro{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.step-title{font-size:1.15rem;font-weight:600;color:var(--txt);line-height:1.3}
.step-desc{font-size:.85rem;color:var(--sec);line-height:1.55;white-space:pre-wrap}
.step-desc b{color:var(--txt);font-weight:600}
.sub{background:var(--card);border:1px solid var(--div);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sub:first-child{border-top:none;padding-top:0}
.sub-title{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:600;color:var(--txt);cursor:pointer;user-select:none}
.sub-title ha-icon{--mdc-icon-size:18px;color:var(--pri)}
.sub-title .chev{margin-left:auto;color:var(--sec);transition:transform .2s}
.sub-title.open .chev{transform:rotate(0deg)}
.sub.collapsed .chev{transform:rotate(-90deg)}
.sub.collapsed .sub-body{display:none}
.fields{background:var(--card);border:1px solid var(--div);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:16px 18px;display:flex;flex-direction:column;gap:16px;grid-column:1/-1}
.sub .fields{background:transparent;border:none;box-shadow:none;padding:0;gap:12px;grid-column:auto}
.field{display:flex;flex-direction:column;gap:7px}
.field-row{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:14px;row-gap:6px}
.field-row .field-help{grid-column:1/-1}
.field-label{font-size:.92rem;font-weight:500;color:var(--txt);line-height:1.4}
.field-help{font-size:.82rem;color:var(--sec);line-height:1.5;white-space:pre-wrap}
.ar-v{font-size:.82rem;font-weight:700;color:var(--pri);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.tg{position:relative;display:inline-flex;width:44px;height:27px;flex-shrink:0;cursor:pointer}
.tg input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.tg-sl{position:absolute;inset:0;background:var(--div);border-radius:999px;transition:background .25s}
.tg-sl:before{content:'';position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s}
.tg input:checked + .tg-sl{background:var(--pri)}
.tg input:checked + .tg-sl:before{transform:translateX(17px)}
.sel{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--div);background:var(--side);color:var(--txt);font-size:.9rem;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none}
.sel:focus{outline:none;border-color:var(--pri)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--div);outline:none;margin:6px 0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--pri);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--pri);cursor:pointer;border:none}
.ar-n{width:68px;padding:4px 6px;border-radius:8px;border:1px solid var(--div);background:var(--bg);color:var(--txt);font-size:.84rem;font-family:inherit;text-align:center;flex-shrink:0}
.mb{display:flex;gap:4px;flex-wrap:wrap}
.mbtn{padding:7px 16px;border-radius:8px;border:1px solid var(--div);font-size:.86rem;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:var(--txt);font-family:inherit}
.mbtn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mbtn:hover:not(.on){border-color:var(--pri)}
.action-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--div);border-radius:var(--card-radius);box-shadow:var(--card-shadow);cursor:pointer;transition:all .15s;width:100%;text-align:left;font-family:inherit}
.action-card:hover{border-color:var(--pri);box-shadow:var(--card-shadow-hover)}
.action-card.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.action-card.disabled:hover{border-color:var(--div);box-shadow:var(--card-shadow)}
.ac-ic{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--pri) 12%,transparent);display:flex;align-items:center;justify-content:center;color:var(--pri);flex-shrink:0}
.ac-ic ha-icon{--mdc-icon-size:20px}
.ac-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ac-t{font-size:.92rem;font-weight:600;color:var(--txt)}
.ac-d{font-size:.78rem;color:var(--sec);line-height:1.4}
.menu-list{display:contents}
.crumb{display:flex;align-items:center;gap:4px;font-size:.82rem;color:var(--sec);padding:2px 0 4px;flex-wrap:wrap;grid-column:1/-1}
.cr-link{color:var(--pri);cursor:pointer}
.cr-cur{color:var(--txt);font-weight:600}
.cr-sep{--mdc-icon-size:14px;color:var(--sec)}
.bot{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--card);border-top:1px solid var(--div)}
.fi{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fi-item{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--sec)}
.fi-item ha-icon{--mdc-icon-size:14px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);padding:8px 20px;border-radius:10px;font-size:.82rem;font-weight:500;z-index:1000;transition:opacity .3s;pointer-events:none;background:rgba(0,0,0,.8);color:#fff}
/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-mask .modal-box{animation:modalFadeIn .18s ease-out}
.modal-mask .modal-title{padding:16px 18px 8px;font-size:1rem;font-weight:600;color:var(--txt)}
.modal-mask .modal-body{padding:4px 18px 12px;font-size:.88rem;color:var(--sec);line-height:1.5}
.modal-mask .modal-actions{padding:8px 18px 16px;display:flex;justify-content:flex-end;gap:8px}
@keyframes modalFadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.modal-box{background:var(--card);border-radius:var(--card-radius);width:90%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.modal-box.wide{max-width:760px}
/* 编辑器窗体：默认就近满屏（最大化展示内容），可拖拽标题栏移动、拖右下角缩放 */
.modal-box.editor-wide{width:94vw;height:90vh;max-width:none;max-height:none}
.modal-box.ed-full{position:fixed;inset:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;border-radius:0;z-index:1001}
/* 拖拽缩放手柄 */
.modal-box.editor-wide .modal-hd{cursor:move;user-select:none}
.modal-rsz{position:absolute;right:0;bottom:0;width:22px;height:22px;pointer-events:none;z-index:7}
.modal-rsz span{position:absolute;right:4px;bottom:4px;width:11px;height:11px;border-right:2px solid var(--sec);border-bottom:2px solid var(--sec);opacity:.55;pointer-events:auto;cursor:nwse-resize}
.modal-rsz span:hover{opacity:.9}
.modal-hd{padding:14px 18px;border-bottom:1px solid var(--div);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-hd span{font-size:1rem;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-x{background:none;border:none;color:var(--sec);cursor:pointer;font-size:1.4rem;line-height:1;flex-shrink:0}
.modal-bd{padding:16px 18px;flex:1;overflow-y:auto}
.modal-ft{padding:12px 18px;border-top:1px solid var(--div);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 16px;border-radius:8px;border:1px solid var(--div);background:var(--bg);color:var(--txt);font-size:.84rem;cursor:pointer;font-family:inherit;font-weight:500}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.danger{background:#FF453A;color:#fff;border-color:#FF453A}
.btn.danger-ghost{background:transparent;color:#FF453A;border-color:#FF453A}
.btn:hover{opacity:.9}
/* ── Rich code/doc editor（对标并超越原生 TemplateSelector 弹窗）── */
.ed-head{padding:12px 16px;border-bottom:1px solid var(--div);background:var(--side)}
.ed-body{display:flex;flex-direction:column;flex:1;min-height:0;height:auto}
.ed-bar{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--side);border-bottom:1px solid var(--div)}
.ed-dot{width:8px;height:8px;border-radius:50%;background:#FF9500;opacity:0;transition:opacity .15s;flex:0 0 auto}
.ed-dot.dirty{opacity:1}
.ed-stat{font-size:.74rem;color:var(--sec);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;flex:0 0 auto}
.ed-spacer{flex:1}
.ed-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;border:1px solid var(--div);background:var(--card);color:var(--txt);font-size:.76rem;cursor:pointer;font-family:inherit}
/* ── 对话管理：左右分栏 ── */
.conv-split{display:flex;gap:0;height:calc(100vh - 160px);min-height:400px;grid-column:1/-1;margin:0 -16px}
.conv-left{width:340px;min-width:240px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--div);padding:12px 12px 0 16px;overflow:hidden}
.conv-right{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 16px 0 12px}
.conv-list{flex:1;overflow-y:auto;margin:0 -12px 0 0;padding-right:8px}
.conv-list-item{padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--div);margin-bottom:0}
.conv-list-item:last-child{border-bottom:none}
.conv-list-item:hover{background:color-mix(in srgb,var(--pri) 6%,var(--bg))}
.conv-list-item.conv-li-active{background:color-mix(in srgb,var(--pri) 12%,var(--bg))}
.conv-li-loading{padding:24px;text-align:center;color:var(--sec);font-size:.85rem}
.conv-li-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.conv-li-title{font-size:.85rem;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-li-meta{font-size:.72rem;color:var(--sec);white-space:nowrap;flex-shrink:0}
.conv-li-preview{font-size:.78rem;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-detail-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:300px;gap:4px}

<script>
/* Pull Home Assistant theme variables from the parent frame (same-origin panel)
   so this panel visually matches the user's active HA theme, and react to changes
   in real-time when the user toggles dark/light mode. */
(function(){
  var THEME_VARS = [
    '--card-background-color','--primary-background-color','--secondary-background-color',
    '--primary-text-color','--secondary-text-color','--divider-color','--primary-color',
    '--text-primary-color','--accent-color','--error-color',
    '--font-family','--border-radius','--ha-card-border-radius'
  ];
  var root = document.documentElement;
  var STORAGE_KEY = 'claw_assistant_theme';

  function getSavedTheme() {
    try { return localStorage.getItem(STORAGE_KEY) || 'auto'; }
    catch(e) { return 'auto'; }
  }

  function saveTheme(mode) {
    try { localStorage.setItem(STORAGE_KEY, mode); } catch(e) {}
  }

  function getEffectiveTheme() {
    var saved = getSavedTheme();
    if (saved === 'light' || saved === 'dark') return saved;
    // auto mode: follow HA parent, fallback to system
    try {
      var p = window.parent && window.parent.document && window.parent.document.documentElement;
      if (p) {
        var cs = getComputedStyle(p);
        var scheme = cs.getPropertyValue('color-scheme') || '';
        if (scheme && scheme.indexOf('dark') >= 0) return 'dark';
        if (p.classList && p.classList.contains('ha-dark')) return 'dark';
      }
    } catch(e) {}
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch(e) { return 'light'; }
  }

  function applyThemeVars() {
    try {
      var p = window.parent && window.parent.document && window.parent.document.documentElement;
      if (p) {
        var cs = getComputedStyle(p);
        for (var i = 0; i < THEME_VARS.length; i++) {
          var v = cs.getPropertyValue(THEME_VARS[i]);
          if (v && v.trim()) root.style.setProperty(THEME_VARS[i], v.trim());
        }
      }
    } catch(e) {}
    // Override with forced dark/light if not auto
    var mode = getSavedTheme();
    var effective = getEffectiveTheme();
    root.classList.toggle('ha-dark', effective === 'dark');
    root.classList.toggle('ha-light', effective === 'light');
    root.style.setProperty('--ha-color-scheme', effective);
    // Apply dark overrides
    applyDarkOverrides(effective === 'dark');
    updateThemeUI();
  }

  function applyDarkOverrides(isDark) {
    if (isDark) {
      // Dark mode: darken variables that HA may not provide for embedded panels
      root.style.setProperty('--bg', root.style.getPropertyValue('--primary-background-color') || '#111111');
      root.style.setProperty('--card', root.style.getPropertyValue('--card-background-color') || '#1c1c1e');
      root.style.setProperty('--side', root.style.getPropertyValue('--secondary-background-color') || '#272729');
      root.style.setProperty('--txt', root.style.getPropertyValue('--primary-text-color') || '#e1e1e1');
      root.style.setProperty('--sec', root.style.getPropertyValue('--secondary-text-color') || '#9b9b9b');
      root.style.setProperty('--div', 'rgba(255,255,255,0.12)');
    } else {
      root.style.setProperty('--bg', root.style.getPropertyValue('--primary-background-color') || '#f7f7f7');
      root.style.setProperty('--card', root.style.getPropertyValue('--card-background-color') || '#ffffff');
      root.style.setProperty('--side', root.style.getPropertyValue('--secondary-background-color') || '#f0f0f0');
      root.style.setProperty('--txt', root.style.getPropertyValue('--primary-text-color') || '#212121');
      root.style.setProperty('--sec', root.style.getPropertyValue('--secondary-text-color') || '#717171');
      root.style.setProperty('--div', 'rgba(0,0,0,0.12)');
    }
  }

  function updateThemeUI() {
    var mode = getSavedTheme();
    var effective = getEffectiveTheme();
    var btn = document.getElementById('themeBtn');
    if (btn) {
      var icon = mode === 'auto' ? 'mdi:theme-light-dark' : (effective === 'dark' ? 'mdi:weather-sunny' : 'mdi:moon-waning-crescent');
      btn.innerHTML = '<ha-icon id="themeIcon" icon="'+icon+'"></ha-icon><span id="themeLabel">'+(mode === 'auto' ? '自动' : (effective === 'dark' ? '暗色' : '亮色'))+'</span><ha-icon icon="mdi:chevron-down" style="margin-left:2px;--mdc-icon-size:14px;color:var(--sec)"></ha-icon>';
    }
    // Update dropdown active state
    var items = document.querySelectorAll('.dd-item[data-theme]');
    items.forEach(function(item) {
      if (item.getAttribute('data-theme') === mode) item.classList.add('active');
      else item.classList.remove('active');
    });
  }

  window.setTheme = function(mode) {
    saveTheme(mode);
    applyThemeVars();
    hideThemeMenu();
  };

  window.toggleThemeMenu = function() {
    var menu = document.getElementById('themeMenu');
    if (menu) menu.classList.toggle('show');
  };

  window.hideThemeMenu = function() {
    var menu = document.getElementById('themeMenu');
    if (menu) menu.classList.remove('show');
  };

  // Close dropdown on outside click
  document.addEventListener('click', function(e) {
    var menu = document.getElementById('themeMenu');
    var btn = document.getElementById('themeBtn');
    if (menu && !menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.remove('show');
    }
  });

  applyThemeVars();

  // Watch for HA theme changes
  setInterval(applyThemeVars, 5000);

  try {
    var parentDoc = window.parent && window.parent.document;
    if (parentDoc && parentDoc.documentElement) {
      var observer = new MutationObserver(function() { applyThemeVars(); });
      observer.observe(parentDoc.documentElement, { attributes: true, attributeFilter: ['class', 'style'] });
      observer.observe(parentDoc.head, { childList: true, subtree: true });
    }
  } catch(e) {}

  try {
    var mql = window.matchMedia('(prefers-color-scheme: dark)');
    var listener = function() { if (getSavedTheme() === 'auto') applyThemeVars(); };
    if (mql.addEventListener) mql.addEventListener('change', listener);
    else if (mql.addListener) mql.addListener(listener);
  } catch(e) {}
})();
</script>

    if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';

// ── 继续对话：面板内聊天弹窗 ──
// 生命周期：openChatModal → conversation_resume（绑定 window_id）→ chatSend
// （conversation_process）→ chatClose/切页/卸载 → conversation_release（释放绑定）。
// window_id 使用独立前缀 claw-panel-*，避免与父窗口 dock 的 claw-window-* 冲突；
// 打开即绑定、关闭即释放，防止全局 resume 绑定污染后续对话。
var _chat = null; // {convId, windowId, userId, sending, started}

function convContinue(convId) {
  // 若已有聊天弹窗打开，先关闭并释放旧绑定
  chatClose();
  var userId = '';
  try {
    if (window.parent && window.parent.hass && window.parent.hass.user && window.parent.hass.user.id) {
      userId = window.parent.hass.user.id;
    }
  } catch(e) {}
  var windowId = 'claw-panel-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  // 1) Resume：绑定对话到 window_id
  api({action:'conversation_resume', conversation_id: convId, window_id: windowId}).then(function(r){
    if (!r.ok) {
      toast('历史已不存在或已删除');
      convRefresh();
      return;
    }
    // 2) 绑定成功，记录 _chat 状态
    _chat = { convId: convId, windowId: windowId, userId: userId || '' };
    // 3) 触发父窗口 HA 原生语音助手对话框
    openAssistDialog();
  });
}
function openAssistDialog() {
  try {
    if (!window.parent) { fallbackToChatModal(); return; }
    var rootEl = window.parent.document.querySelector('home-assistant');
    if (!rootEl) { fallbackToChatModal(); return; }
    // 监听 Assist 对话框关闭事件，释放 resume 绑定
    if (window._assistCloseHandler) {
      try { window.parent.document.removeEventListener('dialog-closed', window._assistCloseHandler); } catch(e) {}
    }
    window._assistCloseHandler = function(e) {
      var detail = e.detail || {};
      if (detail.dialog === 'ha-voice-command-dialog' && _chat) {
        chatReleaseIfOpen();
      }
    };
    try { window.parent.document.addEventListener('dialog-closed', window._assistCloseHandler); } catch(e) {}
    // 触发 HA Assist 对话框
    rootEl.dispatchEvent(new CustomEvent('hass-action', {
      bubbles: true, composed: true,
      detail: {
        config: { tap_action: { action: 'assist', pipeline_id: 'last_used', start_listening: false } },
        action: 'tap'
      }
    }));
  } catch(e) {
    toast('无法打开语音助手: ' + e.message);
    chatReleaseIfOpen();
  }

function fallbackToChatModal() {

}
function openChatModal(convId, windowId, userId) {
  var body = '<div class="chat-msgs" id="chatMsgs"><div class="chat-loading">加载历史对话...</div></div>'
    + '<div class="chat-input-row">'
    + '<textarea class="chat-input" id="chatInput" rows="1" placeholder="输入消息，回车发送（Shift+Enter 换行）" disabled onkeydown="chatInputKey(event)" oninput="chatInputGrow(this)"></textarea>'
    + '<button class="chat-mic" id="chatMicBtn" disabled title="语音对话（即将推出）"><ha-icon icon="mdi:microphone"></ha-icon></button>'
    + '<button class="btn pri chat-send" id="chatSendBtn" disabled onclick="chatSend()"><ha-icon icon="mdi:send"></ha-icon><span>发送</span></button>'
    + '</div>';
  openModal('继续对话', body, '<button class="btn" onclick="chatClose()">关闭</button>', true);
  var box = document.querySelector('.modal-box');
  if (box) box.classList.add('chat-modal');
  _chat = { convId: convId, windowId: windowId, userId: userId || '', sending: false, started: false };
  // 1) resume：校验历史存在并绑定 window_id；失败则不进入聊天态
  api({action:'conversation_resume', conversation_id: convId, window_id: windowId}).then(function(r){
    if (!_chat || _chat.convId !== convId) return; // 弹窗已被关闭
    if (!r.ok) {
      toast('历史已不存在或已删除');
      // 未建立绑定，直接关闭且不调用 release（避免误清其他窗口的绑定）
      _chat = null;
      closeModal();
      convRefresh();
      return;
    }
    // 2) 回放历史 turns（复用 list/get_conversation 既有数据）
    api({action:'get_conversation', conversation_id: convId}).then(function(d){
      if (!_chat || _chat.convId !== convId) return;
      var msgs = $('chatMsgs');
      if (!msgs) return;
      if (d.ok && d.turns && d.turns.length) {
        var h = '<div class="chat-hist-sep">— 历史消息（' + (d.turn_count || d.turns.length) + ' 轮）—</div>';
        d.turns.forEach(function(t){
          if (t.user_message) h += chatBubbleHtml('user', t.user_message, t.timestamp);
          if (t.assistant_response) h += chatBubbleHtml('claw', t.assistant_response, t.timestamp);
        });
        msgs.innerHTML = h;
      } else {
        msgs.innerHTML = '<div class="chat-hist-sep">— 空会话，开始新对话 —</div>';
      }
      msgs.scrollTop = msgs.scrollHeight;
      _chat.started = true;
      var inp = $('chatInput'); if (inp) inp.disabled = false;
      var sb = $('chatSendBtn'); if (sb) sb.disabled = false;
      if (inp) inp.focus();
    });
  });
}
function chatBubbleHtml(who, text, ts) {
  var time = '';
  if (ts) time = '<span class="chat-msg-time">' + new Date(ts * 1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) + '</span>';
  return '<div class="chat-msg ' + who + '">' + eh(text) + time + '</div>';
}
function chatAppendMsg(who, text, ts) {
  var msgs = $('chatMsgs');
  if (!msgs) return;
  msgs.insertAdjacentHTML('beforeend', chatBubbleHtml(who, text, ts));
  msgs.scrollTop = msgs.scrollHeight;
}
function chatShowThinking(on) {
  var msgs = $('chatMsgs');
  if (!msgs) return;
  var el = $('chatThinking');
  if (on) {
    if (!el) msgs.insertAdjacentHTML('beforeend', '<div class="chat-thinking" id="chatThinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Claw 正在思考...</div>');
    msgs.scrollTop = msgs.scrollHeight;
  } else if (el) {
    el.remove();
  }
}
function chatSend() {
  if (!_chat || _chat.sending || !_chat.started) return;
  var inp = $('chatInput');
  if (!inp) return;
  var text = inp.value.trim();
  if (!text) return;
  _chat.sending = true;
  inp.disabled = true;
  var sb = $('chatSendBtn'); if (sb) sb.disabled = true;
  chatAppendMsg('user', text, null);
  inp.value = '';
  chatShowThinking(true);
  api({action:'conversation_process', text: text, conversation_id: _chat.convId, user_id: _chat.userId}).then(function(r){
    if (!_chat) return; // 等待期间弹窗被关闭
    chatShowThinking(false);
    if (r.ok) {
      chatAppendMsg('claw', r.reply || '(无回复)', null);
    } else {
      chatAppendMsg('err', '出错了：' + (r.error || '未知错误'), null);
    }
    _chat.sending = false;
    var ci = $('chatInput');
    if (ci) { ci.disabled = false; ci.focus(); }
    var sb2 = $('chatSendBtn'); if (sb2) sb2.disabled = false;
  });
}
function chatInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    chatSend();

}
function chatClose() {

// 释放 resume 绑定（幂等）：所有关闭路径（X/遮罩/关闭按钮/切页/卸载/Assist关闭）统一经过这里

function openDocByName(key) {

    _openDocEditor(docName, d.content, node, b(d.active));
  });
}
function _openDocEditor(docName, content, node, active) {
  var extraHead = '';

var RULE_CATS = [
  ['always','始终遵循','mdi:check-circle-outline','正向要求，AI 必须做到'],
  ['never','绝对禁止','mdi:shield-alert-outline','安全红线，AI 严禁违反'],
  ['reply','回复要求','mdi:message-text-outline','回复格式约束'],
  ['custom','自定义','mdi:tag-outline','自定义分类']
];
function ruleCatMeta(cat) {
  for (var i=0;i<RULE_CATS.length;i++) if (RULE_CATS[i][0]===cat) return RULE_CATS[i];
  return [cat, cat, 'mdi:tag-outline', ''];
}
function ruleCatOrder(cat) {
  for (var i=0;i<RULE_CATS.length;i++) if (RULE_CATS[i][0]===cat) return i;

}
function renderRulesList() {

    + '</div></div>'
    + '<div class="group-grid" id="rulesBox"><div class="action-card" style="cursor:default;grid-column:1/-1"><div class="ac-ic"><ha-icon icon="mdi:loading"></ha-icon></div><div class="ac-tx"><div class="ac-t">加载中...</div></div></div></div>';
  api({action:'get_rules'}).then(function(d){
    var box = $('rulesBox'); if (!box) return;
    var rules = d.rules || [];
    var statsEl = $('ruleStats');
    if (statsEl) {
      var enabledCount = 0;
      rules.forEach(function(r){ if (r.enabled) enabledCount++; });
      statsEl.innerHTML = '<span>📜 '+rules.length+' 规则</span>'
        + '<span style="color:#4caf50">✓ '+enabledCount+' 启用</span>'
        + '<span style="color:var(--sec)">✗ '+(rules.length-enabledCount)+' 停用</span>';
    }
    if (!rules.length) {
      box.innerHTML = emptyStateHtml('mdi:shield-alert-outline','暂无规则','规则是 AI 的安全边界，会注入 system prompt。点击新建规则添加第一条硬边界。','新建规则','openNewRuleModal()');
      return;
    }
    var groups = {}, order = [];

      var c = r.category || 'custom';
      if (!groups[c]) { groups[c] = []; order.push(c); }
      groups[c].push(r);

function renderRuleGroups(groups, order) {

        + '<button class="btn btn-tip" style="padding:6px 12px" title="编辑规则" onclick="event.stopPropagation();editRule(\''+eh(r.id)+'\',\''+eh(r.category||'always')+'\',\''+eh(r.description.replace(/'/g,"\\'"))+'\')"><ha-icon icon="mdi:pencil"></ha-icon> 编辑</button>'
        + '<button class="btn btn-tip danger-ghost" style="padding:6px 12px" title="删除规则" onclick="event.stopPropagation();deleteRule(\''+eh(r.id)+'\')"><ha-icon icon="mdi:delete"></ha-icon> 删除</button>'

var _ruleSearchTimer = null;
function filterRuleList() {
  if (_ruleSearchTimer) clearTimeout(_ruleSearchTimer);
  _ruleSearchTimer = setTimeout(function(){
    var q = ($('ruleSearch')||{}).value || '';
    q = q.trim().toLowerCase();
    var box = $('rulesBox'); if (!box) return;
    if (!q) {
      box.querySelectorAll('.group-card').forEach(function(c){ c.style.display=''; });
      return;
    }
    box.querySelectorAll('.group-card').forEach(function(card){
      var items = card.querySelectorAll('[data-rule-desc]');
      var hasMatch = false;
      items.forEach(function(item){
        var desc = item.getAttribute('data-rule-desc') || '';
        var match = desc.indexOf(q) >= 0;

      });
      card.style.display = hasMatch ? '' : 'none';
    });
  }, 250);
}

function savePersona(userKey) {
  var data = {};
  var v = function(id){ var el=$('p'+id); return el?el.value.trim():''; };
  data['Name'] = v('Name');
  data['Role'] = v('Role');
  data['Tone'] = v('Type');
  data['Call me'] = v('Call');
  data['Preferences'] = v('Pref');
  data['Time zone'] = v('Tz');
  data['Language'] = v('Lang');

    closeModal();
    if (r.ok) { toast('人设已保存'); } else toast('保存失败: '+(r.error||''));

      '确定拒绝该操作？',
      function(){
        api({action:'resolve_approval', approval_id:approvalId, approved:false, approver:'panel'}).then(function(r){
          if (r.ok) { toast('已拒绝'); renderApprovalsBlock(); }
          else toast('操作失败: '+(r.error||''));

      },
      '拒绝',
      '取消'
    );

  }
  api({action:'resolve_approval', approval_id:approvalId, approved:true, approver:'panel'}).then(function(r){
    if (r.ok) { toast('已批准，操作将执行'); renderApprovalsBlock(); }

  });

function saveMember(isEdit) {
  var provider = $('mmProvider').value;
  var extId = $('mmExtId').value.trim();
  var user = $('mmUser').value;
  var role = $('mmRole').value;
  // 从区域 chip 选择器收集选中的区域 ID
  var areas = [];
  var chipContainer = $('areaChips');
  if (chipContainer) {
    var chips = chipContainer.querySelectorAll('label');
    chips.forEach(function(chip){
      var cb = chip.querySelector('input[type=checkbox]');
      if (cb && cb.checked) {
        var aid = chip.getAttribute('data-area-id') || '';
        if (aid) areas.push(aid);
      }
    });
  }
  var label = $('mmLabel').value.trim();
  if (!provider || !extId) { toast('请填写通道与外部用户 ID'); return; }
  if (!isEdit && !user) { toast('请选择 HA 用户'); return; }
  var payload = {provider:provider, ext_id:extId, role:role, allowed_areas:areas, label:label};
  if (user) payload.ha_user_id = user;
  if (isEdit) {
    api({action:'update_member', provider:provider, ext_id:extId, role:role, allowed_areas:areas, label:label}).then(function(r){
      closeModal();
      if (r.ok) { toast('成员已更新'); renderMemberList(); refreshNow(); } else toast('更新失败: '+(r.error||''));
    });
  } else {
    api({action:'add_member', provider:provider, ext_id:extId, ha_user_id:user, role:role, allowed_areas:areas, label:label}).then(function(r){
      closeModal();
      if (r.ok) { toast('成员已添加'); renderMemberList(); refreshNow(); } else toast('添加失败: '+(r.error||''));
    });
  }
}

  area.value = area.value.slice(0,s)+tok+area.value.slice(e);

// 匹配计数：实时显示查询匹配数量
function edCountMatches(){
  var cnt=$('edMatchCount'), q=$('edFindIn');
  if(!cnt || !q) return;
  var txt=q.value; if(!txt){ cnt.textContent=''; return; }
  var area=$('codeArea'); if(!area){ cnt.textContent=''; return; }
  try{ var m=area.value.match(new RegExp(txt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi')); cnt.textContent=(m?m.length:0)+' 个'; }
  catch(e){ cnt.textContent=''; }
}
function edFindNext(){
  var area=$('codeArea'); if(!area) return;
  var q=$('edFindIn').value; if(!q) return;
  edCountMatches();
  // case-insensitive forward search from cursor
  var lower=area.value.toLowerCase(), lq=q.toLowerCase();
  var from=area.selectionEnd;
  var idx=lower.indexOf(lq, from);
  if(idx<0) idx=lower.indexOf(lq,0);
  if(idx>=0){ area.focus(); area.selectionStart=idx; area.selectionEnd=idx+q.length; }
  else toast('未找到');
}
function edReplaceAll(){

  var q=$('edFindIn').value, r=$('edRepIn').value; if(!q) return;

function setupCodeEditor(){
  var area=$('codeArea'), gut=$('codeGutter'); if(!area||!gut) return;
  // 撤销/重做栈
  var _undo=[], _redo=[], _snapTimer=null;
  function _snap(){
    if(!area) return;
    _undo.push(area.value);
    if(_undo.length>200) _undo.shift();
    _redo=[];
  }
  _snap(); // 初始快照
  area.addEventListener('input', function(){
    clearTimeout(_snapTimer);
    _snapTimer=setTimeout(_snap, 400); // 输入停 400ms 后才存快照，避免高频抖动
  });
  window.__edUndo=function(){
    if(!area||!_undo.length) return;
    _redo.push(area.value);
    area.value=_undo.pop();
    edMarkDirty(); edUpdateStat();
    var gut=$('codeGutter'); if(gut){ var ls=area.value.split('\n').length; gut.textContent=''; for(var i=1;i<=ls;i++)gut.textContent+=i+'\n'; }
  };
  window.__edRedo=function(){
    if(!area||!_redo.length) return;
    _undo.push(area.value);
    area.value=_redo.pop();
    edMarkDirty(); edUpdateStat();
    var gut=$('codeGutter'); if(gut){ var ls=area.value.split('\n').length; gut.textContent=''; for(var i=1;i<=ls;i++)gut.textContent+=i+'\n'; }
  };
  function update(){
    var lines=area.value.split('\n').length;
    var g=''; for(var i=1;i<=lines;i++) g+=i+'\n';
    gut.textContent=g; gut.scrollTop=area.scrollTop;
    edUpdateStat(); edMarkDirty();
  }
  area.addEventListener('input', update);
  area.addEventListener('scroll', function(){ gut.scrollTop=area.scrollTop; });
  area.addEventListener('keydown', function(e){
    if(e.key==='Tab'){
      e.preventDefault();
      var s=area.selectionStart, en=area.selectionEnd;
      if(e.shiftKey){
        var ls=area.value.lastIndexOf('\n', s-1)+1;
        if(area.value.slice(ls,ls+2)==='  '){ area.value=area.value.slice(0,ls)+area.value.slice(ls+2); area.selectionStart=area.selectionEnd=Math.max(ls,s-2); }
      } else {
        area.value=area.value.slice(0,s)+'  '+area.value.slice(en);
        area.selectionStart=area.selectionEnd=s+2;
      }
      update();
    } else if(e.key==='Escape'){
      e.preventDefault(); tryCloseEditor();
    } else if((e.ctrlKey||e.metaKey)&&(e.key==='f'||e.key==='F')){
      e.preventDefault(); edToggleFind();
    } else if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){
      e.preventDefault(); var sv=document.querySelector('.modal-ft .pri'); if(sv) sv.click();
    }
  });
  if(!window.__edVarHandler){
    window.__edVarHandler=true;
    document.addEventListener('click', function(e){
      var m=$('edVarMenu'); if(!m) return;
      var t=e.target;
      if(t.closest && (t.closest('#edVarBtn')||t.closest('#edVarMenu'))) return;
      m.classList.remove('show');
    });
  }
  update();
}
function edUndo(){ if(window.__edUndo) window.__edUndo(); }
function edRedo(){ if(window.__edRedo) window.__edRedo(); }
function openEditor(title, content, headHtml, footHtml, onOpen){
  var body =
    (headHtml ? '<div class="ed-head">'+headHtml+'</div>' : '') +
    '<div class="ed-body">' +
      '<div class="ed-bar">' +
        '<span class="ed-dot" id="edDot"></span>' +
        '<span class="ed-stat" id="edStat">0 字 · 0 词 · 1 行</span>' +
        '<span class="ed-spacer"></span>' +
        '<button class="ed-btn" onclick="edUndo()" title="撤销上一步（快捷键 Ctrl+Z）"><ha-icon icon="mdi:undo"></ha-icon>撤销</button>' +
        '<button class="ed-btn" onclick="edRedo()" title="重做上一步（快捷键 Ctrl+Y）"><ha-icon icon="mdi:redo"></ha-icon>重做</button>' +
        '<button class="ed-btn" onclick="edToggleFind()" title="查找替换（快捷键 Ctrl+F）"><ha-icon icon="mdi:magnify"></ha-icon>查找</button>' +
        '<button class="ed-btn" id="edVarBtn" onclick="edToggleVar(event)"><ha-icon icon="mdi:code-braces"></ha-icon>插入变量</button>' +
        '<button class="ed-btn" onclick="edToggleFull()"><ha-icon icon="mdi:fullscreen"></ha-icon>全屏</button>' +
        '<div class="ed-var-menu" id="edVarMenu">'+edVarMenuHTML()+'</div>' +
      '</div>' +
      '<div class="ed-find" id="edFind">' +
        '<input id="edFindIn" placeholder="查找..." onkeyup="edCountMatches()" onkeydown="if(event.key===\'Enter\')edFindNext()">' +
        '<input id="edRepIn" placeholder="替换为...">' +
        '<span style="font-size:.74rem;color:var(--sec);font-family:monospace;flex:0 0 auto" id="edMatchCount"></span>' +
        '<button class="ed-btn" onclick="edFindNext()">下一个</button>' +
        '<button class="ed-btn" onclick="edReplaceAll()">全部替换</button>' +
      '</div>' +
      '<div class="code-wrap"><div class="code-gutter" id="codeGutter"></div><textarea class="code-area" id="codeArea" spellcheck="false"></textarea></div>' +
    '</div>';
  openModal(title, body, footHtml, true);
  var box=document.querySelector('.modal-box'); if(box) box.classList.add('editor-wide');
  var bd=document.querySelector('.modal-bd'); if(bd){ bd.style.padding='0'; bd.style.overflow='hidden'; bd.style.display='flex'; bd.style.flexDirection='column'; bd.style.minHeight='0'; }
  // 窗体化：脱离 flex 居中，改为 fixed 定位，可拖拽/缩放
  if(box){
    _edBox=box;
    box.style.position='fixed';
    var w=Math.round(window.innerWidth*0.94), h=Math.round(window.innerHeight*0.9);
    box.style.width=w+'px'; box.style.height=h+'px';
    box.style.left=Math.max(0,Math.round((window.innerWidth-w)/2))+'px';
    box.style.top=Math.max(0,Math.round((window.innerHeight-h)/2))+'px';
    box.style.margin='0';
    var hd=box.querySelector('.modal-hd'); if(hd){
      hd.addEventListener('mousedown',function(e){edWinDown('drag',e);});
      hd.addEventListener('dblclick',function(){edToggleFull();});
    }
    var rsz=document.createElement('div'); rsz.className='modal-rsz'; rsz.innerHTML='<span></span>'; box.appendChild(rsz);
    rsz.addEventListener('mousedown',function(e){edWinDown('rsz',e);});
  }
  var area=$('codeArea'); if(area) area.value=content;
  window.__edInitial=content;
  setupCodeEditor();
  if(typeof onOpen==='function') onOpen();
}
function openModal(title, bodyHtml, footHtml, wide) {
  var m = $('modal');
  if (!m) return;
  m.innerHTML = '<div class="modal-bg" onclick="if(event.target===this)tryCloseEditor()">'
    + '<div class="modal-box'+(wide?' wide':'')+'">'
    + '<div class="modal-hd"><span>'+title+'</span><button class="modal-x" onclick="tryCloseEditor()">&times;</button></div>'
    + '<div class="modal-bd">'+bodyHtml+'</div>'
    + (footHtml ? '<div class="modal-ft">'+footHtml+'</div>' : '')
    + '</div></div>';
}
function closeModal() { _edBox=null; _edDrag=false; _edRsz=false; var m = $('modal'); if (m) m.innerHTML = ''; }

// ── 编辑器窗体拖拽 / 缩放 ──
var _edBox=null, _edDrag=false, _edRsz=false, _edSX=0,_edSY=0,_edSL=0,_edST=0,_edSW=0,_edSH=0;
function edWinDown(which,e){
  if(!_edBox || _edBox.classList.contains('ed-full')) return;
  _edDrag = which==='drag'; _edRsz = which==='rsz';
  _edSX=e.clientX; _edSY=e.clientY;
  _edSL=_edBox.offsetLeft; _edST=_edBox.offsetTop; _edSW=_edBox.offsetWidth; _edSH=_edBox.offsetHeight;
  e.preventDefault();
  if(which==='rsz') e.stopPropagation();
}
function edWinMove(e){
  if(!_edBox) return;
  if(_edDrag){ _edBox.style.left=(_edSL+(e.clientX-_edSX))+'px'; _edBox.style.top=(_edST+(e.clientY-_edSY))+'px'; }
  else if(_edRsz){ _edBox.style.width=Math.max(360,_edSW+(e.clientX-_edSX))+'px'; _edBox.style.height=Math.max(240,_edSH+(e.clientY-_edSY))+'px'; }
}
function edWinUp(){ _edDrag=false; _edRsz=false; }
if(!window.__edWinBound){ window.__edWinBound=true; document.addEventListener('mousemove',edWinMove); document.addEventListener('mouseup',edWinUp); }

// ── 数据/工具 ──
function api(body) {
  return fetch(API, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).catch(function(e){return {error:String(e)};});
}
function setStatus(on) {
  var pill = $('sPill'); if (pill) pill.className = 'si-pill' + (on ? '' : ' off');
  var t = $('sTxt'); if (t) t.textContent = on ? '在线' : '离线';
}
function updateClock() {
  var c = $('sClock'); if (c) c.textContent = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
function refreshNow() {
  setStatus(false);
  var txt=$('sTxt');if(txt)txt.textContent='刷新中...';
  api({action:'read'}).then(function(d){
    if(!(d)){setStatus(false);var t=$('sTxt');if(t)t.textContent='无数据';return;}
    var attrs = d.attrs || d;  // 后端 read 返回扁平结构，兼容有无 attrs 包裹
    // 用实时 API 覆盖头部计数（传感器缓存可能过时）
    Promise.all([
      api({action:'get_skills'}), api({action:'get_plugins'}),
      api({action:'get_docs'}), api({action:'get_mappings'})
    ]).then(function(res){
      var sk=res[0].skills, pg=res[1].plugins, dc=res[2].docs, um=res[3].mappings;
      if(sk) attrs.skills=sk;
      if(pg) attrs.plugins=pg;
      if(dc) attrs.docs=dc;
      if(um) attrs.user_mappings=um;
      updateAll(attrs);
    }).catch(function(){ updateAll(attrs); });
  }).catch(function(){setStatus(false);var t=$('sTxt');if(t)t.textContent='失败'});
}
function setOpt(key, value) {
  api({action:'set_option',key:key,value:value}).then(function(){
    if (key === 'enable_voice_fab') {
      // 直接从父窗口注入/移除脚本，即时生效
      try {
        if (value) {
          // 清除父窗口的隐藏状态缓存，确保新注入的按钮显示
          try { parent.localStorage.removeItem('vf_enabled'); } catch(e){}
          // 移除旧的可能存在的脚本，再注入新脚本
          var old = parent.document.querySelector('script[src*="voice_fab"]');
          if (old) old.remove();
          var s = parent.document.createElement('script');
          s.src = '/api/claw_assistant/voice_fab.js?v='+Date.now();
          parent.document.head.appendChild(s);
          toast('语音悬浮已开启');
        } else {
          // 移除脚本 + 清除按钮元素
          var scripts = parent.document.querySelectorAll('script[src*="voice_fab"]');
          scripts.forEach(function(el){ el.remove(); });
          ['vf-wrap','vf-restore'].forEach(function(id){
            var el = parent.document.getElementById(id);
            if (el) el.remove();
          });
          toast('语音悬浮已关闭');
        }
      } catch(e) {
        toast('操作失败: '+e.message);
      }
    } else {
      toast(key+' = '+value);
    }
  });
}
function updateAll(o) {
  if (!o) return;
  var sk=(o.skills||[]), dc=(o.docs||[]), pg=(o.plugins||[]);
  var pa=$('svPa');if(pa)pa.textContent=agName(o.primary_agent);
  var fa=$('svFa');if(fa)fa.textContent=agName(o.fallback_agent);
  var on=$('svOn');
  if(on){
    var tks=['enable_web_search','continuous_conversation','enable_streaming_effect','enable_sidebar_dock','enable_sound_notifications','enable_file_upload','enable_rich_markdown','enable_activity_tracking','enable_tool_details','enable_tool_progress','enable_context_status_bar','enable_voice_fab'];
    on.textContent=tks.filter(function(k){return b(o[k])}).length+'/'+tks.length;
  }
  var e1=$('svSk');if(e1)e1.textContent=sk.length;
  var e2=$('svDc');if(e2)e2.textContent=dc.length;
  var e3=$('svPg');if(e3)e3.textContent=pg.length;
  var e4=$('svUm');if(e4)e4.textContent=(o.user_mappings||[]).length;
  var bt=$('btTime');if(bt)bt.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  setStatus(true);
  _data = {attrs:o};
  renderTabs();
  renderCurrentArea();
}
function reloadConversation() {
  api({action:'reload_conversation'}).then(function(d){ toast(d.ok?'对话已重载':'重载失败'); });
}
function toast(msg) {
  var t=$('toast'); if(t){t.textContent=msg;t.style.opacity='1';setTimeout(function(){t.style.opacity='0'},2200)}
}

// ── Init ──
// 面板 iframe 卸载时释放聊天 resume 绑定（尽力而为；agent 侧对失效绑定有自愈清理兜底）
window.addEventListener('pagehide', function(){
  if (_chat) {
    if (window._assistCloseHandler) {
      try { window.parent.document.removeEventListener('dialog-closed', window._assistCloseHandler); } catch(e) {}
      window._assistCloseHandler = null;
    }
    try { api({action:'conversation_release'}); } catch(e){} _chat = null;
  }
});
function init() {
  api({action:'get_option_schema'}).then(function(d){
    if (d && d.ok) { _schema = d; _agents = d.agents || []; }
    // 显示 claw_assistant 版本号
    var cv=$('caVersion'); if(cv) cv.textContent=_schema.claw_assistant_version||'?';
    refreshNow();
  }).catch(function(){ refreshNow(); });
}
init();
setInterval(refreshNow, 30000);
setInterval(updateClock, 1000);
updateClock();
// 事件委托
document.addEventListener('click', function(e){
  var mb = e.target.closest('[data-claw-mode]');
  if (mb) {
    var m = mb.getAttribute('data-claw-mode');
    var bar = mb.parentElement;
    bar.querySelectorAll('.mbtn').forEach(function(b){b.classList.remove('on')});
    mb.classList.add('on');
    setOpt('conversation_mode', m);
    return;
  }
});
document.addEventListener('change', function(e){
  var el = e.target;
  var key = el.getAttribute('data-claw-key');
  if (!key) return;
  if (el.tagName==='SELECT') setOpt(key, el.value);
  else if (el.tagName==='INPUT' && el.type==='checkbox') setOpt(key, el.checked);
  else if (el.tagName==='INPUT' && (el.type==='range' || el.type==='number')) {
    var v = parseInt(el.value);
    if (key==='pipeline_timeout') v = v*60;
    setOpt(key, v);
  }
});
</script>
